appId: com.smjcco.wxpusher.desktop
# 全局 productName 使用 ASCII，避免 Linux WM_CLASS 中文乱码；mac/win 见平台覆盖
productName: WxPusher
copyright: Copyright © 2026 四川思明今创科技有限公司

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: resources/
    to: resources/

mac:
  productName: WxPusher消息推送平台
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: mac/entitlements.mac.plist
  entitlementsInherit: mac/entitlements.mac.plist
  target:
    - dmg
    - zip
  notarize: true

win:
  productName: WxPusher消息推送平台
  icon: resources/icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  executableName: wxpusher-desktop
  icon: resources/icon.png
  category: Utility
  target:
    - AppImage
    - deb
    - rpm
  desktop:
    Name: WxPusher消息推送平台
    Comment: WxPusher 消息推送平台桌面客户端
    MimeType: x-scheme-handler/wxpusher
    StartupWMClass: wxpusher-desktop

publish:
  provider: generic
  url: https://wxpusher.zjiecode.com/download/
