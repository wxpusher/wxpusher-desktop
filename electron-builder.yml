appId: com.smjcco.wxpusher.desktop
# 用户可见名（mac Bundle/win 安装器/Linux 菜单都用它）；electron-builder v25 起 mac/win 已不再支持平台级 productName
# Linux WM_CLASS / 二进制名通过 linux.executableName 与 linux.desktop.StartupWMClass 单独强制 ASCII
productName: WxPusher消息推送平台
copyright: Copyright © 2026 四川思明今创科技有限公司

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: resources/
    to: resources/

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: mac/entitlements.mac.plist
  entitlementsInherit: mac/entitlements.mac.plist
  target:
    - dmg
    - zip
  notarize: true

win:
  icon: resources/icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  executableName: wxpusher-desktop
  # 强制 Linux 包文件名为 ASCII（顶层 productName 已改中文，否则 AppImage/deb/rpm 文件名会带中文）
  artifactName: 'wxpusher-desktop-${version}-${arch}.${ext}'
  icon: resources/icon.png
  category: Utility
  target:
    - AppImage
    - deb
    - rpm
  desktop:
    Name: WxPusher消息推送平台
    Comment: WxPusher 消息推送平台桌面客户端
    MimeType: x-scheme-handler/wxpusher
    StartupWMClass: wxpusher-desktop

publish:
  provider: generic
  url: https://wxpusher.zjiecode.com/download/
